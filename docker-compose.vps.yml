# SEC-05: Container runtime least privilege & network segmentation
#
# Network topology:
#   proxy-net: caddy <-> frontend <-> backend  (HTTP proxy chain)
#   app-net:   backend <-> workers <-> ai-service <-> db, redis  (application tier)
#
# Backend bridges both networks. Frontend/Caddy cannot reach db/redis/workers.

# Compose project name (renamed thothgraph -> qiko-signal). Volumes are declared external below
# with their original names so the rename reuses the SAME data (zero data movement).
name: qiko-signal

# Healthcheck overrides: the shared backend Dockerfile HEALTHCHECK probes
# :8000 (correct only for the backend HTTP service). ai-service listens on
# :8001 and workers expose no HTTP server, so they inherit a check that always
# fails. These anchors give each tier a correct liveness probe.
x-ai-service-healthcheck: &ai-service-healthcheck
  test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health', timeout=2)"]
  interval: 30s
  timeout: 5s
  start_period: 15s
  retries: 3

x-worker-healthcheck: &worker-healthcheck
  test: ["CMD-SHELL", "python -c \"import os,redis; redis.from_url(os.getenv('REDIS_URL','redis://redis:6379')).ping()\" || exit 1"]
  interval: 30s
  timeout: 5s
  start_period: 15s
  retries: 3

services:
  backend:
    build: ./backend
    command: sh -c "exec sh ./scripts/start-backend.sh"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - /tmp:size=100M
    volumes:
      - generated_storage:/home/appuser/generated_storage
      # GA4 Data API credentials. Read-only, and kept out of the image so the
      # key is never baked into a layer.
      - ./secrets/ga4-service-account.json:/run/secrets/ga4-service-account.json:ro
    env_file:
      - ./.env
      - ./backend/.env
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-user}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@db:5432/${POSTGRES_DB:-dbname}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379}
      - AI_SERVICE_URL=http://ai-service:8001
      # Required, with no default, deliberately. ENVIRONMENT also arrives via
      # env_file, but normalize_runtime_environment() in backend/core/config.py
      # turns an absent OR empty value into "development", which makes
      # _validate_deployed_secrets() return early and silently skip the whole
      # startup secrets guard. A deployment that is missing this line would run
      # unguarded with no signal at all, so `:?` fails the compose command
      # instead. Same pattern as POSTGRES_PASSWORD above. One declaration is
      # enough: compose interpolates the whole file, so every service is gated.
      - ENVIRONMENT=${ENVIRONMENT:?ENVIRONMENT must be set; an empty or missing value disables the startup secrets guard}
      - RUN_MIGRATIONS=1
      - LOCAL_STORAGE_ROOT=${LOCAL_STORAGE_ROOT:-/home/appuser/generated_storage}
      - PYTHONDONTWRITEBYTECODE=1
      - LOG_LEVEL=WARNING
      - SERVICE_CREDENTIAL_ROLE=api_server
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      ai-service:
        condition: service_started
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/system-status', timeout=2)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - proxy-net
      - app-net
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"

  audit-worker:
    build: ./backend
    command: sh -c "exec sh ./scripts/start-worker.sh"
    healthcheck: *worker-healthcheck
    stop_grace_period: 30s
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - /tmp:size=100M
    env_file:
      - ./.env
      - ./backend/.env
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-user}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@db:5432/${POSTGRES_DB:-dbname}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379}
      - AI_SERVICE_URL=http://ai-service:8001
      - RUN_MIGRATIONS=0
      - PYTHONDONTWRITEBYTECODE=1
      - LOG_LEVEL=WARNING
      - SERVICE_CREDENTIAL_ROLE=audit_worker
      - MAX_CONCURRENT_AUDITS=${MAX_CONCURRENT_AUDITS:-4}
    depends_on:
