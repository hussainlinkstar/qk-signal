services:
  backend:
    build: ./backend
    command: sh -c "exec sh ./scripts/start-backend.sh"
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - ./contracts:/contracts:ro
      - generated_storage:/home/appuser/generated_storage
    env_file:
      - ${ROOT_ENV_FILE:-./.env.development}
      - ${BACKEND_ENV_FILE:-./backend/.env.development}
    environment:
      - DATABASE_URL=postgresql://user:password@db:5432/dbname
      - REDIS_URL=redis://redis:6379
      - AI_SERVICE_URL=http://ai-service:8001
      - RUN_MIGRATIONS=1
      - LOG_LEVEL=ERROR
      - BACKEND_RELOAD=1
      - BACKEND_RELOAD_DIR=/app
      - BACKEND_LOG_LEVEL=info
      - BACKEND_ACCESS_LOG=1
      - LOCAL_STORAGE_ROOT=${LOCAL_STORAGE_ROOT:-/home/appuser/generated_storage}
      - SERVICE_CREDENTIAL_ROLE=api_server
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      ai-service:
        condition: service_started
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import requests; requests.get('http://localhost:8000/openapi.json', timeout=2).raise_for_status()",
        ]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s

  audit-worker:
    build: ./backend
    command: sh -c "exec sh ./scripts/start-worker.sh"
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    volumes:
      - ./backend:/app
    env_file:
      - ${ROOT_ENV_FILE:-./.env.development}
      - ${BACKEND_ENV_FILE:-./backend/.env.development}
    environment:
      - DATABASE_URL=postgresql://user:password@db:5432/dbname
      - REDIS_URL=redis://redis:6379
      - AI_SERVICE_URL=http://ai-service:8001
      - LOG_LEVEL=ERROR
      - RUN_MIGRATIONS=0
      - SERVICE_CREDENTIAL_ROLE=audit_worker
      - MAX_CONCURRENT_AUDITS=${MAX_CONCURRENT_AUDITS:-4}
    depends_on:
      db:
        condition: service_started
      redis:
        condition: service_started
      ai-service:
        condition: service_started
      backend:
        condition: service_healthy

  external-webhook-worker:
