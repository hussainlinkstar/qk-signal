    command: sh -c "exec sh ./scripts/start-external-webhook-worker.sh"
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    volumes:
      - ./backend:/app
    env_file:
      - ${ROOT_ENV_FILE:-./.env.development}
      - ${BACKEND_ENV_FILE:-./backend/.env.development}
    environment:
      - DATABASE_URL=postgresql://user:password@db:5432/dbname
      - REDIS_URL=redis://redis:6379
      - LOG_LEVEL=ERROR
      - RUN_MIGRATIONS=0
      - SERVICE_CREDENTIAL_ROLE=external_webhook_worker
    depends_on:
      db:
        condition: service_started
      redis:
        condition: service_started
      backend:
        condition: service_healthy

  email-worker:
