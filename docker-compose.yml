  pdf-worker:
    build: ./backend
    command: sh -c "exec sh ./scripts/start-pdf-worker.sh"
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    volumes:
      - ./backend:/app
      - generated_storage:/home/appuser/generated_storage
    env_file:
      - ${ROOT_ENV_FILE:-./.env.development}
      - ${BACKEND_ENV_FILE:-./backend/.env.development}
    environment:
      - DATABASE_URL=postgresql://user:password@db:5432/dbname
      - REDIS_URL=redis://redis:6379
      - AI_SERVICE_URL=http://ai-service:8001
      - LOG_LEVEL=ERROR
      - RUN_MIGRATIONS=0
      - LOCAL_STORAGE_ROOT=${LOCAL_STORAGE_ROOT:-/home/appuser/generated_storage}
      - SERVICE_CREDENTIAL_ROLE=pdf_worker
    depends_on:
      db:
